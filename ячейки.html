<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Engraver Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #2563eb; }
        
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(59,130,246,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }

        .plate-content {
            max-height: 2000px;
            transition: max-height 0.3s ease-in-out, opacity 0.2s;
            overflow: hidden;
        }
        .plate-collapsed .plate-content {
            max-height: 0;
            opacity: 0;
            padding: 0 !important;
            border: none !important;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8 font-sans">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-b border-slate-700 pb-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div>
                <div class="flex items-center gap-3 mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
                    <h1 class="text-2xl font-bold tracking-tight uppercase italic text-blue-400">Smart Engraver Tool</h1>
                </div>
                <p class="text-slate-400 text-sm">Визуальный контроль выхода текста за пределы рамки.</p>
            </div>
            <div id="statusBadge" class="hidden flex items-center gap-2 px-4 py-2 bg-blue-900/20 text-blue-400 border border-blue-800/50 rounded-lg text-xs font-black uppercase tracking-wider shrink-0">
                <div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div>
                Плашек: <span id="plateCount">0</span>
            </div>
        </header>

        <!-- Загрузка и Глобальный ползунок -->
        <div class="grid md:grid-cols-2 gap-6 mb-8">
            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl flex flex-col justify-center">
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Загрузи таблицу (Excel / CSV)</label>
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" 
                    class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-black file:uppercase file:bg-blue-600 file:text-white hover:file:bg-blue-500 hover:file:cursor-pointer bg-slate-950 rounded-lg p-2 border border-slate-700"
                />
            </div>

            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl flex flex-col justify-center">
                <div class="flex items-center justify-between mb-4">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12H3"/><path d="M17 16l4-4-4-4"/><path d="M7 8l-4 4 4 4"/></svg>
                        Глобальная ширина (все плашки)
                    </label>
                    <span id="globalWidthValueDisplay" class="text-xl font-mono text-blue-400 font-black bg-slate-950 px-3 py-1 rounded border border-slate-700">60</span>
                </div>
                <input type="range" id="globalWidthSlider" min="20" max="110" value="60" class="w-full">
            </div>
        </div>

        <div id="platesContainer" class="grid gap-6">
            <div class="text-center py-16 border-2 border-dashed border-slate-800 rounded-xl text-slate-600 font-bold uppercase text-xs tracking-widest">
                Ожидание файла...
            </div>
        </div>

        <footer class="mt-16 text-center text-slate-700 text-[10px] border-t border-slate-800 pt-8 pb-12 font-black uppercase tracking-[0.3em]">
            Engraving Flow Engine v11.0 // Unclipped Overflow Frame
        </footer>
    </div>

    <script>
        let rawBlocks = [];
        let collapsedStates = [];
        let plateWidths = []; 
        let currentGlobalWidth = 60;

        const fileInput = document.getElementById('fileInput');
        const platesContainer = document.getElementById('platesContainer');
        const statusBadge = document.getElementById('statusBadge');
        const plateCount = document.getElementById('plateCount');
        const globalWidthSlider = document.getElementById('globalWidthSlider');
        const globalWidthValueDisplay = document.getElementById('globalWidthValueDisplay');

        function wrapText(text, limit) {
            let normalizedText = text
                .replace(/[\u2010-\u2015\u2212]/g, '-') // Заменяем длинные/короткие тире и минусы на стандартный дефис
                .replace(/[«»“”]/g, '"');               // Заменяем елочки и лапки на обычные кавычки
            
            let flatText = normalizedText.replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
            const breakWords = [
                "Поставщик", "Договор поставки", "Код материала",
                "Грузоотправитель", "Грузополучатель", "Изготовитель",
                "Наименование изделия", "Дата изготовления", "Количество",
                "№ места", "N места", "Документация в гр.м.", "Документация", 
                "Масса брутто", "Масса нетто", "Габариты груза (мм)", 
                "Габариты груза", "Габариты", "Объект эксплуатации", 
                "Условия хранения"
            ];
            
            breakWords.forEach(word => {
                const safeWord = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(^|\\s)(${safeWord}\\s*:)`, 'gi');
                flatText = flatText.replace(regex, '$1|||BREAK|||$2');
            });

            const rawLines = flatText.split('|||BREAK|||');
            const resultLines = [];

            rawLines.forEach(line => {
                let cleanLine = line.trim();
                if (!cleanLine) return;
                cleanLine = cleanLine
                    .replace(/Зав\.\s*(№|N|No)/gi, 'Зав.№')
                    .replace(/(^|\s)(Зав\.№|Зав|зав\.|г|г\.|ул|ул\.|д|д\.|дом|№|No|N|обл\.|г\.о\.|Приложение №|от|из)\s+/gi, '$1$2\u00A0')
                    .replace(/(\d+)\s+(кг|мм|г\.|шт|г|м)/gi, '$1\u00A0$2');

                const words = cleanLine.split(' ');
                let currentLine = '';
                words.forEach(word => {
                    if ((currentLine.length + word.length + (currentLine ? 1 : 0)) > limit) {
                        if (currentLine) resultLines.push(currentLine);
                        currentLine = word;
                    } else {
                        currentLine = currentLine ? currentLine + ' ' + word : word;
                    }
                });
                if (currentLine) resultLines.push(currentLine);
            });

            return resultLines.map(line => line.replace(/\u00A0/g, ' ')).join('\n');
        }

        window.updateWidth = function(idx, val) {
            plateWidths[idx] = parseInt(val);
            document.getElementById(`width-val-${idx}`).textContent = val;
            
            const newText = wrapText(rawBlocks[idx], plateWidths[idx]);
            document.getElementById(`pre-${idx}`).textContent = newText;
        }

        window.togglePlate = function(idx) {
            collapsedStates[idx] = !collapsedStates[idx];
            renderPlates(false); 
        }

        globalWidthSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            currentGlobalWidth = val;
            globalWidthValueDisplay.textContent = val;

            rawBlocks.forEach((_, idx) => {
                plateWidths[idx] = val;
                
                const valDisplay = document.getElementById(`width-val-${idx}`);
                const slider = document.getElementById(`width-slider-${idx}`);
                const pre = document.getElementById(`pre-${idx}`);
                
                if (valDisplay && slider && pre) {
                    valDisplay.textContent = val;
                    slider.value = val;
                    pre.textContent = wrapText(rawBlocks[idx], val);
                }
            });
        });

        function renderPlates(fullRebuild = true) {
            if (rawBlocks.length === 0) return;
            
            if (fullRebuild && rawBlocks.length !== collapsedStates.length) {
                collapsedStates = new Array(rawBlocks.length).fill(false);
                plateWidths = new Array(rawBlocks.length).fill(currentGlobalWidth);
            }

            platesContainer.innerHTML = '';
            
            rawBlocks.forEach((block, idx) => {
                const isCollapsed = collapsedStates[idx];
                const currentWidth = plateWidths[idx];
                const formattedText = wrapText(block, currentWidth);
                
                const plateDiv = document.createElement('div');
                plateDiv.id = `plate-container-${idx}`;
                plateDiv.className = `group bg-slate-800 rounded-xl border transition-all duration-300 overflow-hidden ${isCollapsed ? 'border-slate-700/50 plate-collapsed bg-slate-900/50' : 'border-slate-700 shadow-xl hover:border-slate-500'}`;
                
                plateDiv.innerHTML = `
                    <div class="flex items-center justify-between px-5 py-4 cursor-pointer select-none bg-slate-800 hover:bg-slate-750 transition-colors" onclick="togglePlate(${idx})">
                        <div class="flex items-center gap-3">
                            <div class="w-3 h-3 rounded-full ${isCollapsed ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.4)]' : 'bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.4)]'}"></div>
                            <span class="text-sm font-black uppercase tracking-widest ${isCollapsed ? 'text-slate-500' : 'text-slate-200'}">
                                ПЛАТА №${idx + 1} ${isCollapsed ? '<span class="ml-2 lowercase font-normal italic opacity-50">(готово)</span>' : ''}
                            </span>
                        </div>
                        <div class="flex items-center gap-4">
                            <button id="copy-btn-${idx}" class="flex items-center gap-2 text-[10px] py-2 px-5 rounded-md transition-all font-black uppercase tracking-tighter ${isCollapsed ? 'bg-slate-700 text-slate-400' : 'bg-blue-600 hover:bg-blue-500 text-white shadow-[0_0_15px_rgba(59,130,246,0.3)]'} active:scale-95" onclick="event.stopPropagation(); copyText(${idx})">
                                <span>${isCollapsed ? 'КОПИРОВАТЬ ПОВТОРНО' : 'КОПИРОВАТЬ ТЕКСТ'}</span>
                            </button>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 transition-transform duration-300 ${isCollapsed ? '' : 'rotate-180'}"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>
                    
                    <div class="plate-content border-t border-slate-700 bg-slate-900 flex flex-col xl:flex-row">
                        <!-- Левая панель с ползунком -->
                        <div class="xl:w-[350px] shrink-0 p-6 border-b xl:border-b-0 xl:border-r border-slate-700 flex flex-col justify-center">
                            <div class="mb-6">
                                <label class="text-xs font-black text-slate-400 uppercase tracking-widest flex items-center justify-between mb-4">
                                    <span class="flex items-center gap-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/></svg>
                                        Индивидуальная ширина
                                    </span>
                                    <span id="width-val-${idx}" class="text-2xl font-mono text-blue-400 font-black bg-slate-950 px-3 py-1 rounded border border-slate-700">${currentWidth}</span>
                                </label>
                                <input type="range" id="width-slider-${idx}" min="20" max="110" value="${currentWidth}" oninput="updateWidth(${idx}, this.value)">
                            </div>
                            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest leading-relaxed">
                                Отрегулируй ширину. Если текст вываливается за красную рамку снизу — он не влезет на заготовку 100х100 мм.
                            </p>
                        </div>

                        <!-- Правая панель со свободной рамкой -->
                        <div class="flex-1 p-8 bg-slate-950 flex justify-center items-start overflow-y-auto max-h-[600px] custom-scrollbar">
                            <div class="relative w-[377px] min-h-[377px] mt-4 mb-8 shrink-0">
                                <!-- Ярлык над рамкой -->
                                <div class="absolute -top-6 left-0 text-[10px] font-black tracking-widest uppercase text-slate-500 z-20">
                                    Рамка: 100x100 мм
                                </div>
                                
                                <!-- Абсолютный фон рамки (фиксированный размер) -->
                                <div class="absolute top-0 left-0 w-[377px] h-[377px] bg-[#050505] border-2 border-dashed border-red-500/60 rounded pointer-events-none z-0"></div>
                                
                                <!-- Текст (свободно растекается вниз) -->
                                <pre id="pre-${idx}" class="relative z-10 font-mono text-[11px] leading-[1.35] text-slate-200 p-4 whitespace-pre w-full">${formattedText}</pre>
                            </div>
                        </div>
                    </div>
                `;

                platesContainer.appendChild(plateDiv);
            });
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const data = evt.target.result;
                const workbook = XLSX.read(data, { type: 'binary' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                let currentBlock = [];
                rawBlocks = [];
                const flatData = [];
                json.forEach(row => row.forEach(cell => {
                    if (cell !== undefined && cell !== null && String(cell).trim() !== '') flatData.push(String(cell).trim());
                }));

                flatData.forEach(text => {
                    if (text.toLowerCase().startsWith('поставщик:')) {
                        if (currentBlock.length > 0) rawBlocks.push(currentBlock.join(' '));
                        currentBlock = [text];
                    } else {
                        currentBlock.push(text);
                    }
                });
                if (currentBlock.length > 0) rawBlocks.push(currentBlock.join(' '));

                statusBadge.classList.remove('hidden');
                plateCount.textContent = rawBlocks.length;
                
                plateWidths = new Array(rawBlocks.length).fill(currentGlobalWidth);
                renderPlates(true);
            };
            reader.readAsBinaryString(file);
        });

        window.copyText = function(idx) {
            const btnElement = document.getElementById(`copy-btn-${idx}`);
            const textToCopy = document.getElementById(`pre-${idx}`).textContent;
            
            const copyFallback = () => {
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                textArea.style.position = "fixed"; textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.select();
                try { document.execCommand('copy'); } catch (err) {}
                document.body.removeChild(textArea);
                finishCopy();
            };

            const finishCopy = () => {
                const span = btnElement.querySelector('span');
                const originalText = span.textContent;
                span.textContent = 'СКОПИРОВАНО';
                btnElement.classList.replace('bg-blue-600', 'bg-green-600');
                btnElement.classList.remove('shadow-[0_0_15px_rgba(59,130,246,0.3)]');
                
                setTimeout(() => {
                    span.textContent = originalText;
                    btnElement.classList.replace('bg-green-600', 'bg-blue-600');
                    collapsedStates[idx] = true;
                    renderPlates(false);
                }, 600);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(finishCopy).catch(copyFallback);
            } else {
                copyFallback(); 
            }
        }
    </script>
</body>
</html>
